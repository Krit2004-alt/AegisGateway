global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "aegis-gateway"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 2s
    static_configs:
      - targets: ["aegis-gateway:8080"]
        labels:
          application: "aegis-gateway"
          environment: "production"
